<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Agent Terminal</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <main id="terminal-pane" aria-label="Terminal">
        <div id="toolbar" role="toolbar" aria-label="Selection actions">
          <button id="send-selection">Send selection</button>
          <button id="capture-selection">Capture selection</button>
          <button id="clear-selection">Clear selection</button>
        </div>
        <div id="terminal"></div>
      </main>
      <div
        id="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize terminal and action window"
        tabindex="0"
      ></div>
      <aside id="monitor" aria-label="Action window">
        <div id="monitor-tabs" role="tablist" aria-label="Action window tabs">
          <button id="tab-capture" role="tab" aria-selected="true" aria-controls="panel-capture">
            Capture<span id="capture-unread" class="unread-dot" hidden aria-label="new captures"></span>
          </button>
          <button id="tab-todo" role="tab" aria-selected="false" aria-controls="panel-todo">
            Todo <span id="todo-count" class="todo-count">0</span>
          </button>
        </div>
        <section id="panel-capture" role="tabpanel" aria-labelledby="tab-capture">
          <div id="monitor-status" role="status" aria-live="polite"></div>
          <div id="command-history" aria-label="Command history"></div>
          <div id="monitor-blocks"></div>
        </section>
        <section id="panel-todo" role="tabpanel" aria-labelledby="tab-todo" hidden>
          <div id="todo-list" aria-label="Todo list"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
