<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Agent Terminal</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <main id="terminal-pane" aria-label="Terminal">
        <div id="toolbar" role="toolbar" aria-label="Selection actions">
          <button id="send-selection">Send selection</button>
          <button id="capture-selection">Capture selection</button>
          <button id="clear-selection">Clear selection</button>
        </div>
        <div id="terminal"></div>
      </main>
      <aside id="monitor" aria-label="Monitor">
        <div id="monitor-status" role="status" aria-live="polite"></div>
        <div id="command-history" aria-label="Command history"></div>
        <div id="monitor-blocks"></div>
      </aside>
    </div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
