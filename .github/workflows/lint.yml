name: lint

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: auditor
          version: 1.31.1
          advanced-security: false

      # Lint and typecheck read only sources and type declarations, so skip the install scripts: postinstall
      # would download the Electron binary and compile node-pty, neither of which this job uses.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails the build on any code TODO/FIXME comment (local/no-todo-comments), catching a --no-verify
      # bypass of the husky pre-commit hook before a deferral marker reaches the default branch.
      - run: pnpm lint

      # vitest strips types without checking them, so this is the only check of the tests' types.
      - run: pnpm typecheck
