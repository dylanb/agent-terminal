name: lint

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # Lint and typecheck read only sources and type declarations, so skip the install scripts: postinstall
      # would download the Electron binary and compile node-pty, neither of which this job uses.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails the build on any code TODO/FIXME comment (local/no-todo-comments), catching a --no-verify
      # bypass of the husky pre-commit hook before a deferral marker reaches the default branch.
      - run: pnpm lint

      # vitest strips types without checking them, so this is the only check of the tests' types.
      - run: pnpm typecheck
