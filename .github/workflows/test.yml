# Runs the vitest suites — the `node` project (tests/unit + tests/integration) and the `browser`
# project (tests/browser), which runs in real Chromium. Both are fast; neither needs a display server,
# so this job stays separate from the Electron e2e workflow.
# The authoritative pass tally is this job's live run, not a number pinned here that drifts on the
# next test added.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build on any code TODO/FIXME comment (local/no-todo-comments), catching a --no-verify
      # bypass of the husky pre-commit hook before a deferral marker reaches the default branch.
      - run: pnpm lint

      # vitest strips types without checking them, so this is the only check of the tests' types.
      - run: pnpm typecheck

      # The `browser` project launches Chromium through the playwright provider; without the binary
      # and its shared libraries the whole `pnpm test` run aborts before the node project reports.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test
