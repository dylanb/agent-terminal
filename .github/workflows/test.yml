# Runs the vitest suites — the `node` project (tests/unit + tests/integration) and the `browser`
# project (tests/browser), which runs in real Chromium. Both are fast; neither needs a display server,
# so this job stays separate from the Electron e2e workflow.
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The `browser` project launches Chromium through the playwright provider; without the binary
      # and its shared libraries the whole `pnpm test` run aborts before the node project reports.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test
