# Builds both apps (agent-terminal and agent-terminal-controller) for macOS arm64 and Linux x64 and uploads
# them to a DRAFT GitHub release, which a human publishes. How to cut a release: docs/releasing.md.
#
# Three entry points:
#   - workflow_dispatch(version): opens a "Release vX.Y.Z" PR that bumps package.json. Nothing is built.
#   - push to main that changes package.json's version (the bump PR merging): tags the merge commit, builds.
#   - push of a v* tag on a commit in main: checks the tag matches package.json at that commit, builds.
# Tags and PR branches pushed with GITHUB_TOKEN start no workflow run, so the main-push path builds in its
# own run instead of relying on the tag it pushes.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0 or 0.2.0-beta.1)'
        required: true
        type: string
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']

permissions:
  contents: read

# Keyed per commit: GitHub keeps one pending run per group, so a shared group would let a later
# package.json merge cancel a queued release run.
concurrency:
  group: release-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  # Written by `bump` and read back by `resolve`; a version one accepts and the other rejects strands main
  # on an unreleasable version.
  RELEASE_VERSION_RE: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Open the version-bump PR
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ $RELEASE_VERSION_RE ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-beta.1 (no leading v)."
            exit 1
          fi
          tag="v$VERSION"
          current=$(node -p "require('./package.json').version")
          if [ "$current" = "$VERSION" ]; then
            echo "::error::package.json on main is already $VERSION."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          branch="release/$tag"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "::error::Branch $branch already exists; close its PR and delete it, or pick another version."
            exit 1
          fi

          git switch -c "$branch"
          npm pkg set version="$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # No [skip ci]: a squash merge of a one-commit PR reuses this message, and [skip ci] on the
          # merge commit would suppress the push-to-main run that tags and builds the release.
          git commit -am "Release $tag"
          git push origin "$branch"

          body=$(cat <<EOF
          Bumps \`package.json\` to \`$VERSION\`.

          Squash-merging this PR tags the merge commit \`$tag\` and builds a draft release (\`release\` workflow).

          Before merging: check out \`$branch\`, run \`pnpm run test:proof\` (docs/test-proof.md), then mark this PR ready.
          EOF
          )
          if ! gh pr create --draft --base main --head "$branch" --title "Release $tag" --body "$body"; then
            echo "::error::Pushed $branch but could not open its PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it by hand: $REPO_URL/compare/main...$branch"
            exit 1
          fi

  resolve:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release: ${{ steps.r.outputs.release }}
      tag: ${{ steps.r.outputs.tag }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: r
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ $RELEASE_VERSION_RE ]]; then
            echo "::error::package.json version '$version' is not a release version."
            exit 1
          fi
          tag="v$version"

          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::Tag $REF_NAME does not match package.json version $version at that commit (expected $tag)."
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
              echo "::error::Tag $REF_NAME points at $sha, which is not on main. Only merged commits are released."
              exit 1
            fi
          else
            # Against the push's starting commit, not HEAD^: a multi-commit push may bump an earlier commit.
            base=$BEFORE
            [[ "$base" =~ ^0+$ ]] && base=HEAD^
            previous=$(git show "$base:package.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")
            if [ "$previous" = "$version" ]; then
              echo "::notice::package.json changed but its version is still $version; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The last line is the dereferenced commit when the tag is annotated.
            tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)
            if [ -z "$tagged" ]; then
              git tag "$tag" "$sha"
              git push origin "refs/tags/$tag"
            elif [ "$tagged" != "$sha" ]; then
              echo "::error::Tag $tag already exists on $tagged, not on this merge commit $sha. Delete the tag and re-run this run, or release $tagged by hand if it is on main."
              exit 1
            fi
          fi

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "release=true"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ad-hoc identity, not none: an unsigned arm64 bundle with its signature broken by packaging is
          # reported as "damaged" with no override, while an ad-hoc one can be opened via "Open Anyway".
          - os: macos-latest
            builder_flags: --mac --arm64 -c.mac.identity=-
          - os: ubuntu-latest
            builder_flags: --linux --x64
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # postinstall rebuilds node-pty against Electron's ABI on this runner's OS and arch.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run gen-icon

      - run: pnpm run build

      - run: pnpm exec electron-builder ${{ matrix.builder_flags }} --publish never

      - run: pnpm exec electron-builder --config electron-builder.controller.yml ${{ matrix.builder_flags }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/controller/*.dmg
            dist/controller/*.zip
            dist/controller/*.AppImage
            dist/controller/*.deb

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The artifact keeps the controller's files under controller/, so collect files, not top-level entries.
          mapfile -t files < <(find assets -type f | sort)
          printf '%s\n' "${files[@]}"

          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>view.err); then
            :
          elif grep -q 'release not found' view.err; then
            draft=
          else
            cat view.err
            echo "::error::Could not check whether release $TAG exists; re-run this job."
            exit 1
          fi
          if [ "$draft" = true ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
            exit 0
          fi
          if [ "$draft" = false ]; then
            echo "::error::Release $TAG is already published; refusing to replace its assets."
            exit 1
          fi

          notes=$(cat <<'EOF'
          **macOS:** the apps are ad-hoc signed, not notarized. On first launch macOS blocks each one; open **System Settings → Privacy & Security** and choose **Open Anyway** (or run `xattr -dr com.apple.quarantine "/Applications/agent-terminal.app" "/Applications/agent-terminal-controller.app"`, naming the apps you installed).
          EOF
          )
          args=(--draft --verify-tag --title "$TAG" --generate-notes --notes "$notes")
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" "${files[@]}"
