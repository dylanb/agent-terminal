# Runs the Playwright _electron e2e suite on Linux under Xvfb — the environment that gives the
# Electron window real focus + an OS clipboard (a macOS subprocess launch cannot, so the
# focus/clipboard tests fail there with no product cause). Mirrors the locally-verified Podman setup
# (see docs/e2e-podman.md). node-pty is rebuilt for the runner's Electron ABI; Xvfb is driven
# manually (xvfb-run can hang after the test process exits).
#
# --shard splits by test only while fullyParallel is on. Without it, whole spec files land on one
# shard and the slowest shard outgrows the timeouts below.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (shard ${{ matrix.shardIndex }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Must stay above setup plus --global-timeout below, or GitHub cancels a long shard before it
    # uploads its blob report.
    timeout-minutes: 30
    outputs:
      shard-total: ${{ strategy.job-total }}
    strategy:
      # One shard failing must not cancel the others, or the merged report loses their results.
      fail-fast: false
      matrix:
        # strategy.job-total counts every matrix combination, so a second matrix axis would break
        # the --shard split. 8, not 6: with 6, the slowest shard came within a minute of
        # --global-timeout in CI.
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # node-pty is native — rebuild it against the runner's Electron ABI (CLAUDE.md).
      - run: pnpm run rebuild

      # Electron uses Chromium's shared libraries; install-deps pulls them. Xvfb is the virtual display; the
      # window-manager tools match e2e/Containerfile.
      - name: System deps (Chromium libs + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils xdotool
          npx playwright install-deps chromium

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs; re-enable
      # so Electron launches without --no-sandbox. (The Podman path uses --cap-add=SYS_ADMIN instead.)
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm run build

      - name: e2e under Xvfb
        env:
          SHARD: ${{ matrix.shardIndex }}/${{ strategy.job-total }}
        run: |
          # Xvfb stderr is only the display server's own log (non-fatal xkbcomp "Could not resolve
          # keysym" noise from an xkb-data older than Chromium's keymap); test reporting comes from
          # Playwright, so discard it.
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          # Leaves setup room inside the 20-minute target. A shard that runs longer fails here with its
          # report written, instead of being cancelled at timeout-minutes with none.
          pnpm exec playwright test --shard="$SHARD" --reporter=list,blob --global-timeout=$((17 * 60 * 1000))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # Merging needs only the Playwright CLI, so skip the Electron download and native rebuild.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # A shard that fails before Playwright writes its report (in setup, or cancelled at
      # timeout-minutes) uploads none, and the merge would silently leave its tests out.
      - name: Check every shard's report arrived
        env:
          EXPECTED: ${{ needs.e2e.outputs.shard-total }}
        run: |
          found=$(find all-blob-reports -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          echo "Merging ${found} of ${EXPECTED:-an unknown number of} shard reports."
          if [ "$found" != "$EXPECTED" ]; then
            echo "::warning::Merging ${found} of ${EXPECTED:-an unknown number of} shard reports. The report leaves out the tests of every shard whose job shows no blob-report upload."
          fi

      - run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
