# §18.1/§27.10
name: feature-dev
steps:
  - id: groom
    kind: loop
    loop: groom-loop
    loop_namespace: app
    inputs:
      - name: ticket
        type: github-ticket
        required: true
  - id: plan
    kind: loop
    loop: plan-loop
    loop_namespace: app
  - id: implement
    kind: loop
    loop: impl-loop
    loop_namespace: app
