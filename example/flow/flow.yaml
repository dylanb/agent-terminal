# §18.1/§27.10
name: feature-dev
steps:
  - id: preparation
    kind: manual
  - id: groom
    kind: loop
    loop: groom-loop
    loop_namespace: app
    todo_template: ticket-grooming
    inputs:
      - name: ticket
        type: github-ticket
        required: true
  - id: plan
    kind: loop
    loop: plan-loop
    loop_namespace: app
    todo_template: plan-loop-review
  - id: implement
    kind: loop
    loop: impl-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: finalize
    kind: manual
    todo_template: polish
