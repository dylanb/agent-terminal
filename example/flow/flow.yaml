# §18.1/§27.10/§28.2
name: feature-dev
steps:
  - id: preparation
    kind: manual
  - id: groom
    kind: loop
    loop: groom-loop
    loop_namespace: app
    todo_template: ticket-grooming
    inputs:
      - name: ticket
        type: github-ticket
        required: true
  - id: plan-bundle
    kind: loop
    loop: plan-bundle-loop
    loop_namespace: app
    todo_template: plan-loop-review
  - id: infra
    kind: loop
    loop: infra-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: red
    kind: loop
    loop: red-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: green
    kind: loop
    loop: green-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: refactor
    kind: loop
    loop: refactor-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: integration-slice
    kind: loop
    loop: integration-slice-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: finalize
    kind: manual
    todo_template: polish
