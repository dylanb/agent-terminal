# §18.1/§27.10/§28.2
name: feature-dev
steps:
  - id: preparation
    kind: manual
  - id: groom
    kind: loop
    loop: groom-loop
    loop_namespace: app
    todo_template: ticket-grooming
    inputs:
      - name: ticket
        type: github-ticket
        required: true
  - id: plan-bundle
    kind: loop
    loop: plan-bundle-loop
    loop_namespace: app
    todo_template: plan-loop-review
  - id: plan-polish
    kind: loop
    loop: plan-polish-loop
    loop_namespace: app
    todo_template: plan-loop-review
  - id: infra
    kind: loop
    loop: infra-loop
    loop_namespace: app
    todo_template: impl-loop-review
  # impl-slice×N (§28.2/§28.4): red→green→refactor repeats once per impl-slice. The refactor step's
  # `repeat` loops back to `red` `slices`-many times (§28.4 loop-back primitive). Until the plan-bundle
  # phase resolves the `slices` input from the slice-plan, the count defaults to 1 — a single slice, the
  # prior behavior — so the directive is inert, never a broken multi-slice chain.
  - id: red
    kind: loop
    loop: red-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: green
    kind: loop
    loop: green-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: refactor
    kind: loop
    loop: refactor-loop
    loop_namespace: app
    todo_template: impl-loop-review
    repeat:
      back_to: red
      count_input: slices
  - id: integration-slice
    kind: loop
    loop: integration-slice-loop
    loop_namespace: app
    todo_template: impl-loop-review
  - id: finalize
    kind: manual
    todo_template: polish
