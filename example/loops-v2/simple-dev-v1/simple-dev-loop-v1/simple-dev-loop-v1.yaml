version: v2
name: simple-dev-loop-v1
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: commits
  goal: "every increment of the plan has a `RED:` commit whose new tests fail by assertion followed by a `GREEN:` commit, the tests and the build pass, every change to a line of a RED test is logged under `### RED test changes`, no change outside the ticket's scope remains, no review pass is left to run, because the latest pass's fixes, or the work itself when no pass ran, changed nothing but this step's report and its recorded test evidence (an edit to the plan, the ticket, code or tests is a change), and this step's report section file holds its decisions, review history and test evidence"
  checkpoint:
    passes: 3
reviewers:
  - persona: impl-review-principal
    charter: charter/principal.md
  - persona: impl-review-tests
    charter: charter/tests.md
  - persona: impl-review-security
    charter: charter/security.md
  - persona: impl-review-taint
    charter: charter/taint.md
  - persona: impl-review-reliability
    charter: charter/reliability.md
  - persona: impl-review-architecture
    charter: charter/architecture.md
  - persona: impl-review-contracts
    charter: charter/contracts.md
  - persona: impl-review-intent
    charter: charter/intent.md
  - persona: impl-review-accessibility
    charter: charter/accessibility.md
  - persona: impl-review-regression-guard
    charter: charter/regression-guard.md
  - persona: impl-review-red-authenticity
    charter: charter/red-authenticity.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary, findings, disposition]
  polish: defer
gate:
  - option: approve
    side_effects:
      - kind: commit
        label: dev
  - option: redo
  - option: polish
  - option: back-to-red
inputs:
  - id: plan
    path: plan.md
  - id: groom-intent
    path: groom-intent.md
  - id: impl-report
    path: impl-report.md
    sections_dir: impl-report
outputs:
  - id: impl-report
    path: impl-report.md
    sections_dir: impl-report
