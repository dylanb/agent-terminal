version: v2
name: simple-plan-approve-loop-v1
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: plan-summary
reviewers: []
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary]
gate:
  - option: approve
    side_effects:
      - kind: gh
        action: mark-ready
      - kind: promote
        artifact: plan
  - option: redo
inputs:
  - id: groom-intent
    path: groom-intent.md
  - id: plan
    path: plan.md
  - id: plan-report
    path: plan-report.md
outputs:
  - id: plan-summary
    path: plan-summary.md
  - id: plan
    path: plan.md
  - id: groom-intent
    path: groom-intent.md
