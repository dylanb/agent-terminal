version: v2
name: red-loop
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: red-result
  completion: red
reviewers:
  - persona: impl-review-tests
    charter: charter/tests.md
  - persona: impl-review-intent
    charter: charter/intent.md
  - persona: impl-review-red-authenticity
    charter: charter/red-authenticity.md
consolidator:
  recipe: prompts/consolidate.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary, findings, disposition]
  polish: defer
gate:
  - option: approve
    side_effects:
      - kind: commit
        label: RED
  - option: request-changes
  - option: redo
  - option: polish
  - option: back-to-red
inputs:
  - id: plan
    path: plan.md
outputs:
  - id: red-result
    path: red-result.json
