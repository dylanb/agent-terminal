version: v2
name: groom-loop
work:
  recipe: prompts/work.md
  artifact: groomed-ticket
reviewers:
  - persona: review-plan-intent
    charter: charter/intent.md
    tools: [Read, Grep, Glob]
consolidator:
  recipe: prompts/consolidate.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary, findings, disposition]
gate:
  - option: approve
    side_effects:
      - kind: gh
        action: update-issue-body
  - option: request-changes
pickup:
  initial_status: grooming
  branch_template: groom/issue-{issue}
outputs:
  - id: groomed-ticket
    path: groomed-ticket.md
