version: v2
name: impl-approve-loop
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: impl-summary
reviewers: []
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary]
gate:
  - option: approve
    side_effects:
      - kind: commit
        label: approve
      - kind: gh
        action: publish-pr-body
        artifact: plan
  - option: redo
inputs:
  - id: groom-intent
    path: groom-intent.md
  - id: plan
    path: plan.md
  - id: impl-report
    path: impl-report.md
  - id: infra-capabilities
    path: infra-capabilities.md
outputs:
  - id: impl-summary
    path: impl-summary.md
