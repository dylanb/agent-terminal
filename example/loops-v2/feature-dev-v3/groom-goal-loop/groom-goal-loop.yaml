version: v2
name: groom-goal-loop
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: groomed-ticket
  goal: the latest review-plan-intent pass on the groomed ticket returned no findings, and groom-report.md logs every decision the groomer made and every finding it fixed or dismissed
reviewers:
  - persona: review-plan-intent
    charter: charter/intent.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary]
gate:
  - option: approve
  - option: redo
inputs:
  - id: groom-intent
    path: groom-intent.md
outputs:
  - id: groomed-ticket
    path: groomed-ticket.md
  - id: groom-report
    path: groom-report.md
