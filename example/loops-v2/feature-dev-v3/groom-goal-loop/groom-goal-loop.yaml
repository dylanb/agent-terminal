version: v2
name: groom-goal-loop
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: groomed-ticket
  goal: "no review pass is left to run, because the latest pass's fixes, or the work itself when no pass ran, changed no file other than this step's own report and result files, and groom-report.md logs every decision the groomer made and every finding it fixed or dismissed"
  checkpoint:
    passes: 3
reviewers:
  - persona: review-plan-intent
    charter: charter/intent.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary]
gate:
  - option: approve
  - option: redo
inputs:
  - id: groom-intent
    path: groom-intent.md
outputs:
  - id: groomed-ticket
    path: groomed-ticket.md
  - id: groom-report
    path: groom-report.md
