version: v2
name: red-loop
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: red-result
  completion: red
  goal: "the slice's new tests fail by assertion while every other test passes, no review pass is left to run, because the latest pass's fixes, or the work itself when no pass ran, changed no file other than this step's own report and result files, and this slice's red report section file holds its decisions, review history and test evidence"
  checkpoint:
    passes: 3
reviewers:
  - persona: impl-review-tests
    charter: charter/tests.md
  - persona: impl-review-intent
    charter: charter/intent.md
  - persona: impl-review-red-authenticity
    charter: charter/red-authenticity.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary, findings, disposition]
  polish: defer
gate:
  - option: approve
    side_effects:
      - kind: commit
        label: RED
  - option: redo
  - option: polish
  - option: back-to-red
inputs:
  - id: plan
    path: plan.md
  - id: groom-intent
    path: groom-intent.md
  - id: impl-report
    path: impl-report.md
    sections: impl-report
outputs:
  - id: red-result
    path: red-result.json
  - id: impl-report
    path: impl-report.md
    sections: impl-report
