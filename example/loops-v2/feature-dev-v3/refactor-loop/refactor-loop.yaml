version: v2
name: refactor-loop
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: commits
  completion: refactor
  goal: "the tests still pass, no review pass is left to run, because the latest pass's fixes, or the work itself when no pass ran, changed nothing but this step's report, its recorded test evidence and documentation (an edit to the plan, the ticket, code or tests is a change, and a comment-only edit to code or tests is documentation), and this slice's refactor report section file holds its decisions, review history and test evidence"
  checkpoint:
    passes: 3
reviewers:
  - persona: impl-review-principal
    charter: charter/principal.md
  - persona: impl-review-tests
    charter: charter/tests.md
  - persona: impl-review-reliability
    charter: charter/reliability.md
  - persona: impl-review-architecture
    charter: charter/architecture.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary, findings, disposition]
  polish: defer
gate:
  - option: approve
    side_effects:
      - kind: commit
        label: refactor
  - option: redo
  - option: polish
  - option: back-to-red
inputs:
  - id: plan
    path: plan.md
  - id: groom-intent
    path: groom-intent.md
  - id: impl-report
    path: impl-report.md
    sections_dir: impl-report
outputs:
  - id: impl-report
    path: impl-report.md
    sections_dir: impl-report
