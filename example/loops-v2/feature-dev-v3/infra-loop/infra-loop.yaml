version: v2
name: infra-loop
brief: prompts/brief.md
work:
  recipe: prompts/work.md
  artifact: commits
  goal: "every reviewer's latest pass found nothing left to fix, the repository's required tests pass, and impl-report.md holds this step's section with its decisions, review history and test evidence"
  checkpoint:
    passes: 3
reviewers:
  - persona: impl-review-principal
    charter: charter/principal.md
  - persona: impl-review-tests
    charter: charter/tests.md
  - persona: impl-review-security
    charter: charter/security.md
  - persona: impl-review-taint
    charter: charter/taint.md
  - persona: impl-review-reliability
    charter: charter/reliability.md
  - persona: impl-review-maintainability
    charter: charter/maintainability.md
  - persona: impl-review-conventions
    charter: charter/conventions.md
  - persona: impl-review-architecture
    charter: charter/architecture.md
  - persona: review-plan-determinism
    charter: charter/determinism.md
boundaries:
  - boundary: pre-work
    mode: clear
report:
  sections: [summary, findings, disposition]
  polish: defer
gate:
  - option: approve
    side_effects:
      - kind: commit
        label: infra
  - option: redo
  - option: polish
inputs:
  - id: plan
    path: plan.md
  - id: groom-intent
    path: groom-intent.md
outputs:
  - id: infra-capabilities
    path: infra-capabilities.md
  - id: impl-report
    path: impl-report.md
