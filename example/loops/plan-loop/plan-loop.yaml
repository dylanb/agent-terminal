# agent-loop engine config — plan-loop (single-phase planning loop)
#
# Authored via /loop-yaml-author. Drives a GitHub issue through a single
# plan-only loop: work-agent drafts `.agent-loop/plan.md`, six reviewer
# personas grade the plan on the thinking highway, consolidator merges,
# and plan-gate approval is terminal — the ticket body is published into
# the issue (and in epic mode, sub-ticket issues are spawned + this PR
# is retargeted to sub-ticket 1). The PR remains OPEN so a successor
# loop (typically impl-loop) can pick up the plan and continue.

name: plan-loop
version: "0.1"
schema_version: "4"

# Engine-significant actor role assignments. The engine reads these to find
# the work-agent + consolidator sessions for bookkeeping, and the reviewer
# personas that get special routing (principal/security stay full-scope under
# reduced-scope rerouting). plan-loop ships six judgment reviewers only — the
# mechanical roles (tests, accessibility, conventions, diagrams) are absent
# by design and intentionally left unbound.
actor_roles:
  work_agent:      work-agent
  consolidator:    consolidator
  principal:       review-principal
  security:        review-security
  intent:          review-intent
  architecture:    review-architecture
  contracts:       review-contracts
  maintainability: review-maintainability

# Charter block whose body substitutes for {{REVIEW-INSTRUCTIONS}} in reviewer SKILLs.
review_instructions_block_id: charter.09-review-instructions

# ---------------------------------------------------------------------------
# §1.16 AdapterBindings — no waiter binding (no CI to wait on)
# ---------------------------------------------------------------------------
adapters:
  persistence: gh-pr
  waiter: gh-pr-checks                  # bound for schema completeness; never invoked (no ci-waiter actor in this loop)
  pickup: issue-to-pr
  prompt_runner: claude-resume
  session_store: state-yaml-fields
  livelog: stderr-livelog
  context_resolver: default-resolver

# ---------------------------------------------------------------------------
# §1.8 Highways — single `thinking` highway (operator chose to collapse;
# the loop's six personas are all judgment-heavy, no value in a separate
# mechanical highway).
# ---------------------------------------------------------------------------
highways:
  - id: thinking
    model: ""
    effort: ""
    warmer:
      enabled: true
      prompt_ref: ""
      skip_under_kb: 20
      min_chain_size: 2
      label: thinking
    ordered_actors:
      - review-principal
      - review-security
      - review-architecture
      - review-intent
      - review-maintainability
      - review-contracts

# ---------------------------------------------------------------------------
# §1.9 Lanes — six judgment lanes; no mechanical lanes (conventions,
# tests, accessibility, diagrams dropped — the deliverable is markdown
# prose, not code).
# ---------------------------------------------------------------------------
lanes:
  - id: review-principal
    title: "Cross-cutting plan judgment / trajectory"
    description: >-
      Whether the plan attacks the right problem at the right scope, and
      whether the codebase's trajectory improves if it is executed. Final
      arbiter at the plan stage. Specialist details route to their own
      lanes.
    owners: [review-principal]
    adjacent: [review-architecture, review-intent, review-maintainability]

  - id: review-security
    title: "OWASP / CWE classes the design opens or closes"
    description: >-
      Design-stage threat model — authn/z, data exposure, trust
      boundaries, dependency surface, secrets handling, and the
      pre-existing shared layers (HTTP clients, repository wrappers,
      logging middleware, error responders) the new flow will newly
      route data through. Catches risk before code is written.
    owners: [review-security]
    adjacent: [review-contracts, review-principal]

  - id: review-architecture
    title: "Module boundaries / layering / one-way doors"
    description: >-
      Boundary respect, dependency direction, irreversible decisions
      flagged as such, seams reused vs. invented. Architectural shape
      of the proposed change.
    owners: [review-architecture]
    adjacent: [review-principal, review-intent, review-contracts]

  - id: review-intent
    title: "Plan ↔ issue fidelity / three-layer description / scope honored"
    description: >-
      Does the plan solve the issue, at the asked-for scope, without
      unsolicited new public capability? Three-layer description
      quality. Acceptance-criteria traceability.
    owners: [review-intent]
    adjacent: [review-principal, review-architecture]

  - id: review-maintainability
    title: "Resulting-code readability / locality / navigability / debt"
    description: >-
      Long-term DX of the codebase after the plan is executed —
      readability, locality of concerns, AI/human navigability, debt
      risk, dev-loop impact.
    owners: [review-maintainability]
    adjacent: [review-principal, review-contracts]

  - id: review-contracts
    title: "API / wire / schema contracts proposed by the plan"
    description: >-
      Endpoints, methods, field types, error shapes, literal-value
      parity across surfaces, versioning discipline, wire-format
      justification.
    owners: [review-contracts]
    adjacent: [review-architecture, review-security]

# ---------------------------------------------------------------------------
# §1.3 Reviewer roster catalog
# ---------------------------------------------------------------------------
default_roster_id: plan-loop-roster
rosters:
  - id: plan-loop-roster
    ordered_actors:
      - review-principal
      - review-security
      - review-architecture
      - review-intent
      - review-maintainability
      - review-contracts
    default:                              # single-phase loop = no narrowing in practice; schema requires ≥1 entry, so mirror ordered_actors
      - review-principal
      - review-security
      - review-architecture
      - review-intent
      - review-maintainability
      - review-contracts
    narrowing_phases: []

# ---------------------------------------------------------------------------
# §1.4 Phases — single plan phase. Plan-gate approval is terminal.
# ---------------------------------------------------------------------------
phases:
  - id: plan
    entry_status: plan-draft
    pre_fanout_actors:
      - work-agent
      - plan-self-check
    ordered_fanout: []
    roster_inherit: true
    primary_work_actor: work-agent
    consolidator_actor: consolidator
    severity_floor_track:
      per_cycle:
        1: major
        2: blocker
      default: blocker
    roster_override_id: ""
    exit_predicate:
      on_verdict:
        clean: post-clean
        needs-work: conditional
      on_phase2_active: true
      severity_cap: 2
    post_clean_gate: awaiting-human-plan-approval
    post_needs_work_gate: awaiting-human-plan-triage

# ---------------------------------------------------------------------------
# §1.5 Gates
# ---------------------------------------------------------------------------
gates:
  - id: awaiting-human-plan-approval
    kind: approve-required
    human_options: [approve, request-changes, impasse]
    human_input_artifact: approve-reason
    prompt_template_ref: prompts/gate-plan-approve.md
    on_approve:
      - kind: epic-promote
        args: {when: "plan.classification == 'epic'"}
      - kind: mark-pr-ready
        on_failure: continue
      # ADR 0015: adapter side effects via `exec`. Allowed by default; a repo opts a loop OUT via
      # `.agent-loop.yaml` `loops_deny_exec: {plan-loop: true}` (terminal-web-ui-spec.md §26.6/v2.122).
      - kind: exec
        args:
          argv: ["gh", "issue", "edit", "{{state.linked_issues[0]}}", "--body-file", "{{artifact.ticket-body}}"]
        on_failure: continue
      - kind: clear-phase2
      - kind: reset-severity-cycle
      - kind: terminate
    on_request_changes:
      - kind: set-phase2
        args: {active: true}
      - kind: clear-persona-state
      - kind: append-human-note
        args: {title: "human request-changes", artifact: "human-notes/{iter}.md"}
    on_impasse:
      - kind: append-human-note
        args: {prefix: "impasse: "}
    next_status_on_approve: plan-human-approved
    next_status_on_request_changes: plan-draft
    next_status_on_impasse: impasse
    advance_to_phase: ""
    terminal_message: "plan approved; loop complete (pass --loop <next> to chain a successor)"

  - id: awaiting-human-plan-triage
    kind: triage
    human_options: [approve, request-changes, impasse]
    human_input_artifact: approve-reason
    prompt_template_ref: prompts/gate-plan-triage.md
    on_approve:
      - kind: append-human-note
        args: {prefix: "plan-triage approve: "}
      - kind: epic-promote
        args: {when: "plan.classification == 'epic'"}
      - kind: mark-pr-ready
        on_failure: continue
      - kind: exec
        args:
          argv: ["gh", "issue", "edit", "{{state.linked_issues[0]}}", "--body-file", "{{artifact.ticket-body}}"]
        on_failure: continue
      - kind: clear-phase2
      - kind: reset-severity-cycle
      - kind: terminate
    on_request_changes:
      - kind: set-phase2
        args: {active: true}
      - kind: clear-persona-state
      - kind: append-human-note
        args: {title: "human request-changes", artifact: "human-notes/{iter}.md"}
    on_impasse:
      - kind: append-human-note
        args: {prefix: "impasse: "}
    next_status_on_approve: plan-human-approved
    next_status_on_request_changes: plan-draft
    next_status_on_impasse: impasse
    advance_to_phase: ""
    terminal_message: "plan approved (via triage); loop complete (pass --loop <next> to chain a successor)"

  - id: plan-draft
    kind: in-flight
    human_options: [impasse]
    human_input_artifact: ""
    prompt_template_ref: ""
    on_approve: []
    on_request_changes: []
    on_impasse:
      - kind: append-human-note
        args: {prefix: "impasse: "}
    next_status_on_approve: ""
    next_status_on_request_changes: ""
    next_status_on_impasse: impasse
    advance_to_phase: ""

  - id: plan-human-approved
    kind: terminal
    human_options: []
    human_input_artifact: ""
    prompt_template_ref: ""
    on_approve: []
    on_request_changes: []
    on_impasse: []
    next_status_on_approve: ""
    next_status_on_request_changes: ""
    next_status_on_impasse: ""
    advance_to_phase: ""

  - id: impasse
    kind: terminal
    human_options: []
    human_input_artifact: ""
    prompt_template_ref: ""
    on_approve: []
    on_request_changes: []
    on_impasse: []
    next_status_on_approve: ""
    next_status_on_request_changes: ""
    next_status_on_impasse: ""
    advance_to_phase: ""

# ---------------------------------------------------------------------------
# §1.6 Verdict taxonomy — the synonym set
# normalizes LLM verdict drift regardless of loop domain.
# ---------------------------------------------------------------------------
verdicts:
  persona:
    canonical: [clean, concerns]
    synonyms:
      clean: clean
      concerns: concerns
      approved: clean
      approve: clean
      ok: clean
      pass: clean
      passed: clean
      "no issues": clean
      no-issues: clean
      needs-work: concerns
      needs_work: concerns
      "needs work": concerns
      changes-requested: concerns
      changes_requested: concerns
      "changes requested": concerns
      blocked: concerns
      issues: concerns
      request-changes: concerns
      request_changes: concerns
      "request changes": concerns
      needs-changes: concerns
  consolidated:
    canonical: [clean, needs-work]
    synonyms:
      clean: clean
      needs-work: needs-work
      needs_work: needs-work
      "needs work": needs-work
      concerns: needs-work
      changes-requested: needs-work
      changes_requested: needs-work
      "changes requested": needs-work
      request-changes: needs-work
      request_changes: needs-work
      "request changes": needs-work
      blocked: needs-work
      issues: needs-work
      approved: clean
      approve: clean
      ok: clean
      pass: clean
      passed: clean
      "no issues": clean
      no-issues: clean
  severities:
    order: [minor, major, blocker]
  phase2_bounce_rules:
    on_request_changes_set_active: true
    reset_cycle_on_approve: true
    force_triage_on_needs_work: true

# ---------------------------------------------------------------------------
# §1.10 CharterDef — 9 blocks (dropped: 04-missing-entirely, 05-source-comments)
# ---------------------------------------------------------------------------
charter:
  blocks:
    - id: charter.00-preamble
      body_ref: charter/00-preamble.md
      variables: []
    - id: charter.01-cite-named-standards
      body_ref: charter/01-cite-named-standards.md
      variables: []
    - id: charter.02-severity-rubric
      body_ref: charter/02-severity-rubric.md
      variables: ["PLAN_MODE_DIRECTIVE"]
    - id: charter.03-severity-floor
      body_ref: charter/03-severity-floor.md
      variables: ["SEVERITY_FLOOR"]
    - id: charter.06-considered-dropped
      body_ref: charter/06-considered-dropped.md
      variables: []
    - id: charter.07-depth-probes
      body_ref: charter/07-depth-probes.md
      variables: []
    - id: charter.08-legal-verdict-strings
      body_ref: charter/08-legal-verdict-strings.md
      variables: []
    - id: charter.09-review-instructions
      body_ref: charter/09-review-instructions.md
      variables: []
    - id: charter.plan-mode-directive
      body_ref: charter/plan-mode-directive.md
      variables: ["PLAN_LINE_THRESHOLD", "PLAN_LINE_TAKE_ACTION"]

  compose:
    - selector: "*"
      phase: plan
      ordered_blocks: &all_charter_blocks
        - charter.00-preamble
        - charter.01-cite-named-standards
        - charter.02-severity-rubric
        - charter.03-severity-floor
        - charter.06-considered-dropped
        - charter.07-depth-probes
        - charter.08-legal-verdict-strings
      token_substitutions:
        PLAN_MODE_DIRECTIVE: charter.plan-mode-directive
    - selector: review-security
      phase: plan
      ordered_blocks: *all_charter_blocks
      token_substitutions:
        PLAN_MODE_DIRECTIVE: charter.plan-mode-directive
    - selector: review-architecture
      phase: plan
      ordered_blocks: *all_charter_blocks
      token_substitutions:
        PLAN_MODE_DIRECTIVE: charter.plan-mode-directive

# ---------------------------------------------------------------------------
# §1.7 Artifact schemas — 11 artifacts (dropped: pr-description, review-ci,
# ci-summary; no impl phase = no CI = no PR-body draft).
# ---------------------------------------------------------------------------
artifacts:
  - id: state
    path_pattern: "state.yaml"
    producer: ""
    consumers: ["*"]
    freshness: {lifecycle: persistent, stale_after: "", on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: plan
    path_pattern: "plan.md"
    producer: work-agent
    consumers: ["*"]
    freshness: {lifecycle: per-phase, stale_after: phase, on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: ticket-body
    path_pattern: "ticket.md"
    producer: work-agent
    consumers: ["*"]
    freshness: {lifecycle: per-phase, stale_after: phase, on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: plan-gate-report
    path_pattern: "plan-gate-report.md"
    producer: work-agent
    consumers: [engine]
    freshness: {lifecycle: per-iter, stale_after: iter, on_reset: remove}
    access_mode: write-once-per-iter
    json_schema_ref: ""

  - id: pr-context
    path_pattern: "pr-context.md"
    producer: engine
    consumers: ["*"]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: ""

  - id: pending-feedback
    path_pattern: "pending-feedback.md"
    producer: human
    consumers: [engine]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: approve-reason
    path_pattern: "approve-reason.md"
    producer: human
    consumers: [engine]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: takeover-signal
    path_pattern: "takeover-requested.yaml"
    producer: human
    consumers: [engine]
    freshness: {lifecycle: persistent, stale_after: "", on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: human-note
    path_pattern: "human-notes/{iter}.md"
    producer: human
    consumers: [work-agent, consolidator]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: notes
    path_pattern: "notes.md"
    producer: work-agent
    consumers: [work-agent]
    freshness: {lifecycle: persistent, stale_after: "", on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: persona-output
    path_pattern: "reviews/{iter}/{actor}.json"
    producer: ""
    consumers: [consolidator]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: ""                  # engine work: author schemas/plan-loop/persona-output.json

  - id: consolidated
    path_pattern: "reviews/{iter}/consolidated.json"
    producer: consolidator
    consumers: [engine, work-agent]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: ""                  # engine work: author schemas/plan-loop/consolidated.json

  - id: human-review-transcript
    path_pattern: "reviews/{iter}/human-review-transcript.md"
    producer: ups-hook
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: log-actor
    path_pattern: "logs/{iter}-{actor}.log"
    producer: engine
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: log-actor-checkpoint
    path_pattern: "logs/{iter}-{actor}-checkpoint.log"
    producer: engine
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: log-warmer
    path_pattern: "logs/{iter}-warmer-{highway}.log"
    producer: engine
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: log-handoff
    path_pattern: "logs/{iter}-handoff-{phase}.log"
    producer: engine
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: prompt-render
    path_pattern: "prompts/{iter}-{actor}.md"
    producer: engine
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: ""

  - id: stub-pr-body
    path_pattern: ""
    producer: ""
    consumers: [engine]
    freshness: {lifecycle: persistent, stale_after: "", on_reset: preserve}
    access_mode: read-only
    json_schema_ref: ""

# ---------------------------------------------------------------------------
# §1.2 Actors — work-agent, plan-self-check, warmer-thinking, 6 personas,
# consolidator, handoff. (No warmer-normal, no self-review, no ci-waiter,
# no pr-description.)
# ---------------------------------------------------------------------------
actors:
  - id: work-agent
    prompt_template_ref: "prompts/work-{phase}.md"
    recipe:
      slots:
        - {name: "(template body)", source_kind: template-file, source_args: {ref: "prompts/work-{phase}.md"}, on_missing: fail}
        - {name: "Variables", source_kind: template-token, source_args: {tokens: [ITERATION, PREV_ITER, PR_NUMBER, HEAD_REF, PLAN_LINE_THRESHOLD]}, on_missing: fail}
        - {name: "Prior session summary", source_kind: loop-extension-data, source_args: {fn: consumeWorkSessionSummary}, on_missing: omit}
        - {name: "PR context", source_kind: artifact, source_args: {id: pr-context}, on_missing: fail}
        - {name: "Previous consolidated review", source_kind: peer-output-prior, source_args: {id: consolidated}, on_missing: omit, iteration_filter: "iter>1"}
        - {name: "Human note", source_kind: human-input, source_args: {ref: "human-notes/{iter-1}.md"}, on_missing: omit, iteration_filter: "iter>1"}
        - {name: "Notes (post-reset session memory)", source_kind: artifact, source_args: {id: notes}, on_missing: omit}
    highway: thinking
    model: ""
    effort: ""
    session_policy: {kind: actor-persistent, cross_iter: true, cross_phase: true}
    checkpoint_policy:
      enabled: true
      warn_tokens: 0
      hard_stop_tokens: 0
      checkpoint_prompt: workCheckpointPrompt
    output_artifacts: []
    livelog: {enabled: true, sink: ""}
    post_clean_follow_ups: []
    resume_behavior: {on_resume_replay: true, on_resume_skip: false, step_key: work}

  - id: plan-self-check
    prompt_template_ref: prompts/work-plan-self-check.md
    recipe:
      slots:
        - {name: "(template body)", source_kind: template-file, source_args: {ref: prompts/work-plan-self-check.md}, on_missing: fail}
        - {name: "Variables", source_kind: template-token, source_args: {tokens: [ITERATION, PREV_ITER, PR_NUMBER, PLAN_LINE_THRESHOLD]}, on_missing: fail}
        - {name: "review-intent SKILL", source_kind: skill, source_args: {actor: review-intent}, on_missing: fail}
        - {name: "review-principal SKILL", source_kind: skill, source_args: {actor: review-principal}, on_missing: fail}
    highway: thinking
    model: ""
    effort: ""
    session_policy: {kind: shared-with, shared_with_id: work-agent, cross_iter: true, cross_phase: false}
    checkpoint_policy: {enabled: false}
    output_artifacts: []
    livelog: {enabled: true, sink: ""}
    post_clean_follow_ups: []
    resume_behavior: {on_resume_replay: false, on_resume_skip: true, step_key: plan-self-check}

  - id: warmer-thinking
    prompt_template_ref: ""
    recipe:
      slots:
        - {name: "Agent-loop review lane", source_kind: highway-info, source_args: {emit: warmer_label}, on_missing: fail}
        - {name: "PR context", source_kind: artifact, source_args: {id: pr-context}, on_missing: fail, on_empty: fail}
        - {name: "Plan", source_kind: artifact, source_args: {id: plan}, on_missing: omit, on_empty: omit}
        - {name: "Ticket", source_kind: artifact, source_args: {id: ticket-body}, on_missing: omit, on_empty: omit}
        - {name: "", source_kind: template-token, source_args: {tokens: [WARMER_SUFFIX]}, on_missing: fail}
    highway: thinking
    model: ""
    effort: ""
    session_policy: {kind: fresh, cross_iter: false, cross_phase: false}
    checkpoint_policy: {enabled: false}
    output_artifacts: []
    livelog: {enabled: true, sink: ""}
    post_clean_follow_ups: []
    resume_behavior: {on_resume_replay: false, on_resume_skip: true, step_key: warmer-thinking}

  - id: review-principal
    lanes: [review-principal]
    prompt_template_ref: ""
    recipe:
      slots:
        - {name: "Charter + severity floor", source_kind: charter-block, source_args: {compose_for_actor: review-principal}, on_missing: fail}
        - {name: "SKILL", source_kind: skill, source_args: {actor: review-principal}, on_missing: fail}
        - {name: "PR context", source_kind: artifact, source_args: {id: pr-context}, on_missing: fail}
        - {name: "Plan", source_kind: artifact, source_args: {id: plan}, on_missing: fail}
        - {name: "Ticket", source_kind: artifact, source_args: {id: ticket-body}, on_missing: fail}
        - {name: "Prior dismissed findings", source_kind: peer-output-prior, source_args: {id: consolidated, json_path: "findings_dismissed[persona=review-principal]"}, on_missing: omit, iteration_filter: "iter>1"}
        - {name: "LANES_CATALOG_IDS", source_kind: lanes-catalog, source_args: {shape: id-list-with-adjacency}, on_missing: fail}
        - {name: "Resume independence note", source_kind: template-token, source_args: {tokens: [HIGHWAY_SHARED_DISCLAIMER]}, on_missing: fail}
    highway: thinking
    model: ""
    effort: ""
    session_policy: {kind: highway-shared, cross_iter: false, cross_phase: false}
    checkpoint_policy: {enabled: false}
    output_artifacts: [persona-output]
    livelog: {enabled: true, sink: ""}
    post_clean_follow_ups: []
    resume_behavior: {on_resume_replay: true, on_resume_skip: false, step_key: review-principal}
    scope_policy: {reduced_scope_exempt: true, test_only_overrides_exemption: true}

  - id: review-security
    lanes: [review-security]
    prompt_template_ref: ""
    recipe:
      slots:
        - {name: "Charter + severity floor", source_kind: charter-block, source_args: {compose_for_actor: review-security}, on_missing: fail}
        - {name: "SKILL", source_kind: skill, source_args: {actor: review-security}, on_missing: fail}
