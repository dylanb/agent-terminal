# agent-loop engine config — impl-loop
#
# Skips the plan phase: the plan is a pre-authored INPUT
# (ticket + AC + plan.md), not a deliverable this loop produces. Reviewers
# operate without a pre-injected diff and without seeing the plan; they
# review the PR using whatever read-only mechanism suits the finding, with
# ticket AC as the spec and the repository's standards as the grading rubric.

name: impl-loop
version: "0.1"
schema_version: "4"

# Engine-significant actor role assignments. The engine reads these to find
# the work-agent + consolidator sessions for bookkeeping, and the reviewer
# personas that get special routing (principal/security stay full-scope under
# reduced-scope rerouting; tests downgrades on test-only deltas; accessibility
# filters on a11y-relevant files). Bindings must match this loop's declared
# actor IDs, which use the `impl-review-*` prefix.
actor_roles:
  work_agent:      work-agent
  consolidator:    consolidator
  principal:       impl-review-principal
  security:        impl-review-security
  tests:           impl-review-tests
  accessibility:   impl-review-accessibility
  intent:          impl-review-intent
  architecture:    impl-review-architecture
  contracts:       impl-review-contracts
  maintainability: impl-review-maintainability
  conventions:     impl-review-conventions
  diagrams:        impl-review-diagrams

# Charter block whose body substitutes for {{REVIEW-INSTRUCTIONS}} in reviewer SKILLs.
review_instructions_block_id: charter.09-review-instructions

# Per-loop label taxonomy. publisher reads from the bound LoopDef's Labels;
# .agent-loop.yaml rejects a top-level labels: key. Per-repo overrides go via
# the .agent-loop.yaml loops: registry pointing at a working-tree copy of this
# yaml with edited labels. Plan-phase slots are omitted: impl-loop has no plan
# phase.
labels:
  pr:
    impl-draft: agent-loop/impl-draft
    awaiting-human-pr-approval: agent-loop/awaiting-human-pr
    awaiting-human-impl-triage: agent-loop/awaiting-human-triage
    awaiting-team-review: agent-loop/awaiting-team-review
    impasse: agent-loop/impasse
  issue:
    in_progress: agent-loop/in-progress
    ready: agent-loop/ready
    epic: agent-loop/epic
    sub_ticket: agent-loop/sub-ticket

# ---------------------------------------------------------------------------
# §1.16 AdapterBindings
# ---------------------------------------------------------------------------
adapters:
  persistence: gh-pr
  waiter: gh-pr-checks
  pickup: issue-to-pr
  prompt_runner: claude-resume
  session_store: state-yaml-fields
  livelog: stderr-livelog
  context_resolver: default-resolver

# ---------------------------------------------------------------------------
# §1.8 Highways — impl-review-* ordered_actors
# ---------------------------------------------------------------------------
highways:
  - id: thinking
    model: ""
    effort: ""
    warmer:
      enabled: true
      prompt_ref: ""
      skip_under_kb: 20
      min_chain_size: 2
      label: thinking
    ordered_actors:
      - impl-review-principal
      - impl-review-security
      - impl-review-taint
      - impl-review-reliability
      - impl-review-architecture
      - impl-review-intent
      - impl-review-maintainability

  - id: normal
    model: ""
    effort: ""
    warmer:
      enabled: true
      prompt_ref: ""
      skip_under_kb: 20
      min_chain_size: 2
      label: normal
    ordered_actors:
      - impl-review-conventions
      - impl-review-contracts
      - impl-review-tests
      - impl-review-accessibility
      - impl-review-diagrams

# ---------------------------------------------------------------------------
# §1.9 Lanes — owners are impl-review-* actors.
# review-intent lane title repurposed: AC-anchored, not plan-anchored.
# ---------------------------------------------------------------------------
lanes:
  - id: impl-review-principal
    title: "Cross-cutting judgment / trajectory"
    description: >-
      Whether the diff is the right change and whether the codebase's
      trajectory improves after it lands. Owns
      'right-change-vs-correct-implementation' and PR-as-deliverable
      hygiene at the cross-cutting level. Does NOT cover specialist
      details (security, contracts, tests) — those route to their own
      lanes.
    owners: [impl-review-principal]
    adjacent: [impl-review-architecture, impl-review-intent, impl-review-maintainability, impl-review-reliability]

  - id: impl-review-conventions
    title: "Naming / style / formatting / CI YAML hygiene"
    description: >-
      Repo coding style, naming, file layout, formatting, CI-workflow
      YAML hygiene, .editorconfig / lint-config adherence.
    owners: [impl-review-conventions]
    adjacent: [impl-review-maintainability, impl-review-contracts]

  - id: impl-review-security
    title: "OWASP / CWE / threat model / authn-authz / injection / taint reach"
    description: >-
      OWASP top-10 classes, secrets exposure, PII, authN/authZ,
      input-validation / output-encoding, dependency risk. Aperture
      is newly *exercised* code, not only newly *changed* code:
      traces new sources from the diff through shared transit code
      into pre-existing sinks (loggers, query builders, HTTP-out,
      shell, FS, error responders). Defense-in-depth overlap with
      impl-review-taint, which owns the exhaustive byte-level pass.
    owners: [impl-review-security]
    adjacent: [impl-review-taint, impl-review-reliability, impl-review-contracts, impl-review-conventions, impl-review-principal]

  - id: impl-review-taint
    title: "Byte-from-boundary-to-sink taint tracer"
    description: >-
      Mechanical, exhaustive dataflow pass. Enumerates every new
      user-controlled source the change introduces (including new
      callsites of pre-existing wrappers) and walks each one across
      the diff edge through every hop until it terminates at an
      encoded landing, a return, or a sink. Flags any unsafe sink
      landing (logger, query, template, shell, FS, HTTP-out, response
      echo, telemetry). Severity is reachability × data class — not
      threat-model judgment, which lives in impl-review-security.
    owners: [impl-review-taint]
    adjacent: [impl-review-security, impl-review-reliability, impl-review-contracts, impl-review-principal]

  - id: impl-review-reliability
    title: "Failure modes / unrecoverable states / resource exhaustion"
    description: >-
      What the change does when it does NOT get what it expects.
      Owns unguarded throws on best-effort and critical paths,
      swallowed or empty error reasons, states the user cannot
      recover from through the UI, partial-failure ordering between
      an external side effect and a persisted transition, resource
      exhaustion (unbounded walks, watches, retries), incomplete
      cleanup on revert/error paths, and idempotence under retry.
      Judges RECOVERABILITY, not exploitability (impl-review-security)
      and not coverage (impl-review-tests).
    owners: [impl-review-reliability]
    adjacent: [impl-review-security, impl-review-taint, impl-review-tests, impl-review-principal]

  - id: impl-review-architecture
    title: "Module boundaries / coupling / SOLID at module scale"
    description: >-
      ADRs, service boundaries, layering, dependency direction,
      CI-pipeline shape, infra-code boundary decisions. One-way doors
      only.
    owners: [impl-review-architecture]
    adjacent: [impl-review-principal, impl-review-intent, impl-review-contracts]

  - id: impl-review-contracts
    title: "API / wire formats / literal-value parity"
    description: >-
      API contracts (OpenAPI, gRPC, GraphQL), data-model invariants,
      serialization, literal-value parity across surfaces.
    owners: [impl-review-contracts]
    adjacent: [impl-review-architecture, impl-review-conventions, impl-review-security]

  - id: impl-review-tests
    title: "Coverage / behavior-vs-implementation / hermeticity"
    description: >-
      Coverage adequacy, behavior-not-implementation assertions, edge
      cases, hermeticity, infra-code smoke tests.
    owners: [impl-review-tests]
    adjacent: [impl-review-maintainability, impl-review-contracts, impl-review-reliability]

  - id: impl-review-intent
    title: "AC-vs-implementation fidelity / scope-creep / non-goals honored"
    description: >-
      Ticket acceptance criteria are the spec; this lane grades whether
      the diff satisfies every AC bullet, whether the diff's footprint
      is justified by AC items or named discovery rationale, and
      whether non-goals are honored. PR-body alignment in-lane.
    owners: [impl-review-intent]
    adjacent: [impl-review-principal, impl-review-architecture]

  - id: impl-review-maintainability
    title: "Readability / locality / AHA / AI navigability / dev-loop"
    description: >-
      Long-term DX: readability, abstraction discipline, AI
      navigability (traceability, reasoning depth, information
      density), dev-loop regression.
    owners: [impl-review-maintainability]
    adjacent: [impl-review-conventions, impl-review-principal]

  - id: impl-review-accessibility
    title: "WCAG 2.1 AA"
    description: >-
      Keyboard operability, screen-reader semantics, color contrast,
      focus management, touch targets, motion. UI-touching changes
      only.
    owners: [impl-review-accessibility]
    adjacent: [impl-review-conventions, impl-review-contracts]

  - id: impl-review-diagrams
    title: "Mermaid validity + structural-change diagram coverage"
    description: >-
      Structural-change diagram coverage, Mermaid validity (parse
      rules, escape entities), diagram-as-code discipline.
    owners: [impl-review-diagrams]
    adjacent: [impl-review-maintainability, impl-review-architecture]

# ---------------------------------------------------------------------------
# §1.3 Reviewer roster catalog
# ---------------------------------------------------------------------------
default_roster_id: impl-loop-roster
rosters:
  - id: impl-loop-roster
    ordered_actors:
      - impl-review-principal
      - impl-review-conventions
      - impl-review-security
      - impl-review-taint
      - impl-review-reliability
      - impl-review-architecture
      - impl-review-contracts
      - impl-review-tests
      - impl-review-intent
      - impl-review-maintainability
      - impl-review-accessibility
      - impl-review-diagrams
    default:
      - impl-review-principal
      - impl-review-conventions
      - impl-review-security
      - impl-review-taint
      - impl-review-reliability
      - impl-review-architecture
      - impl-review-contracts
      - impl-review-tests
      - impl-review-intent
      - impl-review-maintainability
      - impl-review-accessibility
      - impl-review-diagrams
    narrowing_phases: []

# ---------------------------------------------------------------------------
# §1.4 Phases — impl only (plan is an INPUT, not a phase here)
# ---------------------------------------------------------------------------
phases:
  - id: impl
    entry_status: impl-draft
    pre_fanout_actors:
      - work-agent
      - self-review
      - ci-waiter
    ordered_fanout: []
    roster_inherit: true
    primary_work_actor: work-agent
    consolidator_actor: consolidator
    severity_floor_track:
      per_cycle:
        1: minor
        2: minor
        3: major
        4: major
        5: blocker
      default: blocker
    roster_override_id: ""
    chain_dispatch:
      legacy_exit: awaiting-human-pr-approval
      chain_finalize_only: awaiting-team-review
      chain_finalize_advance: impl-draft
    exit_predicate:
      on_verdict:
        clean: post-clean
        needs-work: conditional
      on_phase2_active: true
      severity_cap: 5
    post_clean_gate: awaiting-human-pr-approval
    post_needs_work_gate: awaiting-human-impl-triage

# ---------------------------------------------------------------------------
# §1.5 Gates — plan-related gates removed; impl/triage/terminal kept
# ---------------------------------------------------------------------------
gates:
  - id: awaiting-human-pr-approval
    kind: approve-required
    human_options: [approve, request-changes, impasse]
    human_input_artifact: approve-reason
    prompt_template_ref: prompts/gate-impl-approve.md
    on_approve:
      - kind: publish-body
        on_failure: continue
      - kind: clear-phase2
      - kind: terminate
    on_request_changes:
      - kind: set-phase2
        args: {active: true}
      - kind: clear-persona-state
      - kind: append-human-note
        args: {title: "human request-changes", artifact: "human-notes/{iter}.md"}
    on_impasse:
      - kind: append-human-note
        args: {prefix: "impasse: "}
    next_status_on_approve: awaiting-team-review
    next_status_on_request_changes: impl-draft
    next_status_on_impasse: impasse
    advance_to_phase: ""
    terminal_message: "code approved; PR is now waiting for team review"

  - id: awaiting-human-impl-triage
    kind: triage
    human_options: [approve, request-changes, impasse]
    human_input_artifact: approve-reason
    prompt_template_ref: prompts/gate-impl-triage.md
    on_approve:
      - kind: append-human-note
        args: {prefix: "impl-triage approve: "}
      - kind: clear-phase2
      - kind: reset-severity-cycle
      - kind: terminate
    on_request_changes:
      - kind: set-phase2
        args: {active: true}
      - kind: clear-persona-state
      - kind: append-human-note
        args: {title: "human request-changes", artifact: "human-notes/{iter}.md"}
    on_impasse:
      - kind: append-human-note
        args: {prefix: "impasse: "}
    next_status_on_approve: awaiting-team-review
    next_status_on_request_changes: impl-draft
    next_status_on_impasse: impasse
    advance_to_phase: ""
    terminal_message: "PR is now waiting for team review"

  - id: impl-draft
    kind: in-flight
    human_options: [impasse]
    human_input_artifact: ""
    prompt_template_ref: ""
    on_approve: []
    on_request_changes: []
    on_impasse:
      - kind: append-human-note
        args: {prefix: "impasse: "}
    next_status_on_approve: ""
    next_status_on_request_changes: ""
    next_status_on_impasse: impasse
    advance_to_phase: ""

  - id: awaiting-team-review
    kind: terminal
    human_options: []
    human_input_artifact: ""
    prompt_template_ref: ""
    on_approve: []
    on_request_changes: []
    on_impasse: []
    next_status_on_approve: ""
    next_status_on_request_changes: ""
    next_status_on_impasse: ""
    advance_to_phase: ""

  - id: impasse
    kind: terminal
    human_options: []
    human_input_artifact: ""
    prompt_template_ref: ""
    on_approve: []
    on_request_changes: []
    on_impasse: []
    next_status_on_approve: ""
    next_status_on_request_changes: ""
    next_status_on_impasse: ""
    advance_to_phase: ""

# ---------------------------------------------------------------------------
# §1.6 Verdict taxonomy
# ---------------------------------------------------------------------------
verdicts:
  persona:
    canonical: [clean, concerns]
    synonyms:
      clean: clean
      concerns: concerns
      approved: clean
      approve: clean
      ok: clean
      pass: clean
      passed: clean
      "no issues": clean
      no-issues: clean
      needs-work: concerns
      needs_work: concerns
      "needs work": concerns
      changes-requested: concerns
      changes_requested: concerns
      "changes requested": concerns
      blocked: concerns
      issues: concerns
      request-changes: concerns
      request_changes: concerns
      "request changes": concerns
      needs-changes: concerns
  consolidated:
    canonical: [clean, needs-work]
    synonyms:
      clean: clean
      needs-work: needs-work
      needs_work: needs-work
      "needs work": needs-work
      concerns: needs-work
      changes-requested: needs-work
      changes_requested: needs-work
      "changes requested": needs-work
      request-changes: needs-work
      request_changes: needs-work
      "request changes": needs-work
      blocked: needs-work
      issues: needs-work
      approved: clean
      approve: clean
      ok: clean
      pass: clean
      passed: clean
      "no issues": clean
      no-issues: clean
  severities:
    order: [minor, major, blocker]
  phase2_bounce_rules:
    on_request_changes_set_active: true
    reset_cycle_on_approve: true
    force_triage_on_needs_work: true

# ---------------------------------------------------------------------------
# §1.10 CharterDef — drops plan-mode-directive; adds 99-pr-context
# ---------------------------------------------------------------------------
charter:
  blocks:
    - id: charter.00-preamble
      body_ref: charter/00-preamble.md
      variables: []
    - id: charter.01-cite-named-standards
      body_ref: charter/01-cite-named-standards.md
      variables: []
    - id: charter.01a-stack-translation
      body_ref: charter/01a-stack-translation.md
      variables: []
    - id: charter.02-severity-rubric
      body_ref: charter/02-severity-rubric.md
      variables: ["PLAN_MODE_DIRECTIVE"]
    - id: charter.03-severity-floor
      body_ref: charter/03-severity-floor.md
      variables: ["SEVERITY_FLOOR"]
    - id: charter.04-missing-entirely
      body_ref: charter/04-missing-entirely.md
      variables: []
    - id: charter.05-source-comments
      body_ref: charter/05-source-comments.md
      variables: ["LEAN_MVP_DIRECTIVE"]
    - id: charter.06-considered-dropped
      body_ref: charter/06-considered-dropped.md
      variables: []
    - id: charter.07-depth-probes
      body_ref: charter/07-depth-probes.md
      variables: []
    - id: charter.08-legal-verdict-strings
      body_ref: charter/08-legal-verdict-strings.md
      variables: []
    - id: charter.09-review-instructions
      body_ref: charter/09-review-instructions.md
      variables: []
    - id: charter.99-pr-context
      body_ref: charter/99-pr-context.md
      variables: []
    - id: charter.lean-mvp-directive
      body_ref: charter/lean-mvp-directive.md
      variables: ["PLAN_LINE_THRESHOLD", "PLAN_LINE_TAKE_ACTION"]

  compose:
    - selector: "*"
      phase: impl
      ordered_blocks: &all_charter_blocks
        - charter.00-preamble
        - charter.01-cite-named-standards
        - charter.01a-stack-translation
        - charter.02-severity-rubric
        - charter.03-severity-floor
        - charter.04-missing-entirely
        - charter.05-source-comments
        - charter.06-considered-dropped
        - charter.07-depth-probes
        - charter.08-legal-verdict-strings
        - charter.99-pr-context
      token_substitutions:
        LEAN_MVP_DIRECTIVE: charter.lean-mvp-directive
    - selector: impl-review-security
      phase: impl
      ordered_blocks: *all_charter_blocks
      token_substitutions: {}
    - selector: impl-review-taint
      phase: impl
      ordered_blocks: *all_charter_blocks
      token_substitutions: {}
    - selector: impl-review-reliability
      phase: impl
      ordered_blocks: *all_charter_blocks
      token_substitutions: {}
    - selector: impl-review-architecture
      phase: impl
      ordered_blocks: *all_charter_blocks
      token_substitutions: {}

# ---------------------------------------------------------------------------
# §1.7 Artifact schemas — plan kept (input only); reviewers don't consume it
# ---------------------------------------------------------------------------
artifacts:
  - id: state
    path_pattern: "state.yaml"
    producer: ""
    consumers: ["*"]
    freshness: {lifecycle: persistent, stale_after: "", on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: plan
    path_pattern: "plan.md"
    producer: ""                          # external — pre-authored (operator drops it in)
    consumers: [work-agent, self-review, consolidator]
    freshness: {lifecycle: persistent, stale_after: "", on_reset: preserve}
    access_mode: read-only
    json_schema_ref: ""

  - id: pr-context
    path_pattern: "pr-context.md"
    producer: ""
    consumers: ["*"]
    freshness: {lifecycle: per-iter, stale_after: iter, on_reset: remove}
    access_mode: read-only
    json_schema_ref: ""

  - id: pr-description
    path_pattern: "pr-description.md"
    producer: pr-description
    consumers: [engine]
    freshness: {lifecycle: per-phase, stale_after: phase, on_reset: remove}
    access_mode: write-once-per-iter
    json_schema_ref: ""

  - id: pending-feedback
    path_pattern: "pending-feedback.md"
    producer: human
    consumers: [engine]
    freshness: {lifecycle: per-iter, stale_after: iter, on_reset: remove}
    access_mode: read-write
    json_schema_ref: ""

  - id: approve-reason
    path_pattern: "approve-reason.txt"
    producer: human
    consumers: [engine]
    freshness: {lifecycle: per-iter, stale_after: iter, on_reset: remove}
    access_mode: write-once-per-iter
    json_schema_ref: ""

  - id: takeover-signal
    path_pattern: "takeover-requested.yaml"
    producer: human
    consumers: [engine]
    freshness: {lifecycle: per-iter, stale_after: iter, on_reset: remove}
    access_mode: write-once-per-iter
    json_schema_ref: ""

  - id: human-note
    path_pattern: "human-notes/{iter}.md"
    producer: engine
    consumers: [work-agent]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: notes
    path_pattern: "notes.md"
    producer: work-agent
    consumers: [work-agent]
    freshness: {lifecycle: persistent, stale_after: "", on_reset: preserve}
    access_mode: read-write
    json_schema_ref: ""

  - id: persona-output
    path_pattern: "reviews/{iter}/review-{persona}.json"
    producer: "{persona}"
    consumers: [consolidator, work-agent]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: schemas/pe-loop/persona-output.json

  - id: consolidated
    path_pattern: "reviews/{iter}/consolidated.json"
    producer: consolidator
    consumers: [engine, work-agent]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: schemas/pe-loop/consolidated-output.json

  - id: review-ci
    path_pattern: "reviews/{iter}/review-ci.json"
    producer: ci-waiter
    consumers: [consolidator]
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: schemas/pe-loop/persona-output.json

  - id: ci-summary
    path_pattern: "reviews/{iter}/ci-summary.json"
    producer: ci-waiter
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: write-once-per-iter
    json_schema_ref: ""

  - id: human-review-transcript
    path_pattern: "reviews/{iter}/human-review-transcript.md"
    producer: ups-hook
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
    access_mode: append-only
    json_schema_ref: ""

  - id: log-actor
    path_pattern: "logs/{iter}-{actor}.log"
    producer: engine
    consumers: []
    freshness: {lifecycle: per-iter, stale_after: "", on_reset: preserve}
