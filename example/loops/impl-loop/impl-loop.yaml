        - {name: "PR context", source_kind: artifact, source_args: {id: pr-context}, on_missing: fail}
        - {name: "Plan", source_kind: artifact, source_args: {id: plan}, on_missing: omit}
        - {name: "Persona files directive", source_kind: template-token, source_args: {tokens: [READ_PERSONA_JSONS_DIRECTIVE]}, on_missing: fail}
    highway: thinking
    model: ""
    effort: ""
    session_policy: {kind: actor-persistent, cross_iter: true, cross_phase: true}
    checkpoint_policy:
      enabled: true
      warn_tokens: 0
      hard_stop_tokens: 0
      checkpoint_prompt: consolidatorCheckpointPrompt
    output_artifacts: [consolidated]
    livelog: {enabled: true, sink: ""}
    post_clean_follow_ups:
      - id: handoff
      - id: pr-description
    resume_behavior: {on_resume_replay: true, on_resume_skip: false, step_key: consolidator}

  # -------------------------------------------------------------------------
  # handoff — post-clean follow-up on consolidator session
  # -------------------------------------------------------------------------
  - id: handoff
    prompt_template_ref: "prompts/handoff-{phase}.md"
    recipe:
      slots:
        - {name: "(template body)", source_kind: template-file, source_args: {ref: "prompts/handoff-{phase}.md"}, on_missing: fail}
        - {name: "Variables", source_kind: template-token, source_args: {tokens: [ITERATION, PR_NUMBER, PR_TITLE, HEAD_REF]}, on_missing: fail}
    highway: thinking
    model: ""
    effort: ""
    session_policy: {kind: shared-with, shared_with_id: consolidator, cross_iter: false, cross_phase: false}
    checkpoint_policy: {enabled: false}
    output_artifacts: []
    livelog: {enabled: true, sink: ""}
    post_clean_follow_ups: []
    resume_behavior: {on_resume_replay: false, on_resume_skip: true, step_key: handoff}

  # -------------------------------------------------------------------------
  # pr-description — post-clean follow-up; impl phase only
  # -------------------------------------------------------------------------
  - id: pr-description
    prompt_template_ref: prompts/pr-description.md
    recipe:
      slots:
        - {name: "(template body)", source_kind: template-file, source_args: {ref: prompts/pr-description.md}, on_missing: fail}
        - {name: "Variables", source_kind: template-token, source_args: {tokens: [ITERATION, PR_NUMBER, PR_TITLE, HEAD_REF, REVIEW_DIR]}, on_missing: fail}
    highway: thinking
    model: ""
    effort: ""
    session_policy: {kind: shared-with, shared_with_id: consolidator, cross_iter: false, cross_phase: false}
    checkpoint_policy: {enabled: false}
    output_artifacts: [pr-description]
    livelog: {enabled: true, sink: ""}
    post_clean_follow_ups: []
    resume_behavior: {on_resume_replay: false, on_resume_skip: true, step_key: pr-description}
    phase_filter: [impl]

# ---------------------------------------------------------------------------
# §1.12 State — extension fields (engine code dependency)
# ---------------------------------------------------------------------------
state_extension:
  fields:
    - {name: WorkSessionSummary,                    go_type: string,                                  default: "",    persistence: yaml,      side_file: ""}
    - {name: WorkSessionSummaryForSID,              go_type: string,                                  default: "",    persistence: yaml,      side_file: ""}
    - {name: ConsolidatorSessionSummary,            go_type: string,                                  default: "",    persistence: yaml,      side_file: ""}
    - {name: ConsolidatorSessionSummaryForSID,      go_type: string,                                  default: "",    persistence: yaml,      side_file: ""}
    - {name: ConsolidatorCheckpointPendingAtSID,    go_type: string,                                  default: "",    persistence: yaml,      side_file: ""}
    - {name: ActorSessionSummaries,                 go_type: "map[string]ActorSessionSummary",        default: {},    persistence: yaml,      side_file: ""}
    - {name: LastSelfReviewIter,                    go_type: int,                                     default: 0,     persistence: yaml,      side_file: ""}
    - {name: PersonaState,                          go_type: "map[string]PersonaRecord",              default: {},    persistence: yaml,      side_file: ""}
    - {name: Epic,                                  go_type: "*EpicState",                            default: ~,     persistence: yaml,      side_file: ""}
    - {name: AutoChain,                             go_type: bool,                                    default: false, persistence: yaml,      side_file: ""}
    - {name: LinkedIssues,                          go_type: "[]int",                                 default: [],    persistence: yaml,      side_file: ""}
    - {name: SeverityCycleIter,                     go_type: int,                                     default: 0,     persistence: yaml,      side_file: ""}
    - {name: Phase2Active,                          go_type: bool,                                    default: false, persistence: yaml,      side_file: ""}
    - {name: ResumeMidIter,                         go_type: int,                                     default: 0,     persistence: yaml,      side_file: ""}
    - {name: IterInFlight,                          go_type: int,                                     default: 0,     persistence: yaml,      side_file: ""}

# ---------------------------------------------------------------------------
# §1.13 ResumeContract
# ---------------------------------------------------------------------------
resume_contract:
  mid_iter_safe: true
  on_reset:
    - kind: clear-state-fields
      args:
        fields:
          - WorkSessionSummary
          - WorkSessionSummaryForSID
          - ConsolidatorSessionSummary
          - ConsolidatorSessionSummaryForSID
          - ConsolidatorCheckpointPendingAtSID
          - PersonaState
          - LastSelfReviewIter
          - SeverityCycleIter
          - Phase2Active

# ---------------------------------------------------------------------------
# §1.14 PickupContract
# ---------------------------------------------------------------------------
pickup_contract:
  bootstrap_kind: issue-to-pr
  seed_source: issue-number
  initial_status: impl-draft
  initial_branch_tpl: "agent-loop/issue-{issue}"
  initial_pr_body_ref: stub-pr-body
  initial_labels:
    - {action: remove, slot: ready,        target: issue, source: issue}
    - {action: add,    slot: in_progress,  target: issue, source: issue}
    - {action: add,    slot: impl-draft,   target: pr,    source: current}
  on_conflict: wipe-and-retry

# ---------------------------------------------------------------------------
# §1.15 CLIDef
# ---------------------------------------------------------------------------
cli:
  subcommands:
    - {name: "<pr>",            action: run-loop,             args: [{name: pr, type: int, required: true}], flags: []}
    - {name: pickup,            action: pickup-bootstrap,     args: [{name: issue, type: int, required: true}], flags: [{name: base, type: string}]}
    - {name: available,         action: pickup-list-ready,    args: [],                                       flags: [{name: repo, type: string}]}
    - {name: resume,            action: run-loop-resume,      args: [],                                       flags: [{name: reset, type: bool}, {name: ask, type: bool}]}
    - {name: status,            action: print-state,          args: [],                                       flags: [{name: dir, type: string}]}
    - {name: approve,           action: approve-gate,         args: [],                                       flags: [{name: reason, type: string}, {name: reason-file, type: string}]}
    - {name: request-changes,   action: request-changes-gate, args: [],                                       flags: [{name: reason, type: string}, {name: reason-file, type: string}]}
    - {name: impasse,           action: impasse-gate,         args: [],                                       flags: [{name: reason, type: string}]}
    - {name: takeover,          action: takeover-signal,      args: [],                                       flags: [{name: reason, type: string}]}
    - {name: "commands install",action: install-commands,     args: [],                                       flags: []}
    - {name: "commands check",  action: check-commands,       args: [],                                       flags: []}
    - {name: "commands uninstall", action: uninstall-commands, args: [],                                      flags: []}
    - {name: "commands remove", action: remove-commands,      args: [],                                       flags: []}
    - {name: "hook user-prompt",action: hook-handler,         args: [],                                       flags: []}
    - {name: version,           action: print-version,        args: [],                                       flags: []}
    - {name: help,              action: print-help,           args: [],                                       flags: []}

  slash_commands:
    - {filename: agent-loop-approve.md,           body_ref: commands/agent-loop-approve.md}
    - {filename: agent-loop-request-changes.md,   body_ref: commands/agent-loop-request-changes.md}
    - {filename: agent-loop-status.md,            body_ref: commands/agent-loop-status.md}
    - {filename: agent-loop-compose-feedback.md,  body_ref: commands/agent-loop-compose-feedback.md}
    - {filename: agent-loop-impasse.md,           body_ref: commands/agent-loop-impasse.md}
    - {filename: agent-loop-resume.md,            body_ref: commands/agent-loop-resume.md}
    - {filename: review-principal.md,             body_ref: commands/review-principal.md}
    - {filename: review-conventions.md,           body_ref: commands/review-conventions.md}
    - {filename: review-security.md,              body_ref: commands/review-security.md}
    - {filename: review-taint.md,                 body_ref: commands/review-taint.md}
    - {filename: review-reliability.md,           body_ref: commands/review-reliability.md}
    - {filename: review-architecture.md,          body_ref: commands/review-architecture.md}
    - {filename: review-contracts.md,             body_ref: commands/review-contracts.md}
    - {filename: review-tests.md,                 body_ref: commands/review-tests.md}
    - {filename: review-intent.md,                body_ref: commands/review-intent.md}
    - {filename: review-maintainability.md,       body_ref: commands/review-maintainability.md}
    - {filename: review-accessibility.md,         body_ref: commands/review-accessibility.md}
    - {filename: review-diagrams.md,              body_ref: commands/review-diagrams.md}

# ---------------------------------------------------------------------------
# §1.17 TestOnlyDetection
# ---------------------------------------------------------------------------
scope_override:
  kind: match-rules
  rules:
    - {suffix: "_test.go"}
    - {path_segment: testdata}

# ---------------------------------------------------------------------------
# §1.9 LaneRouting
# ---------------------------------------------------------------------------
lane_routing:
  strict: false
  fallback_actor: impl-review-principal
  fallback_audit_tag: unknown-lane

# ---------------------------------------------------------------------------
# §1.18 ConfigBindings — review.plan_lanes dropped (no plan phase)
# ---------------------------------------------------------------------------
config_bindings:
  - token: PLAN_LINE_THRESHOLD
    type: int
    default: 1000
    yaml_path: plan_line_threshold
    cli_flag: --plan-line-threshold
    validate: { min: 1, max: 10000 }
    description: "Production-LOC budget the work agent estimates against. Reviewers do not litigate the estimate; see review-principal's size-threshold check (dropped in impl-loop since the plan is not in reviewer context)."

  - token: PLAN_LINE_TAKE_ACTION
    type: int
    default: 2000
    yaml_path: plan_line_take_action
    cli_flag: --plan-line-take-action
    validate: { min: 1, max: 20000 }
    description: "Warn-bar production-LOC value. Independent of --plan-line-threshold."

  - token: ""
    type: string
    default: ""
    yaml_path: models.opus
    cli_flag: --opus-model
    validate: {}
    description: >-
      Model id pinned for the thinking lane: work agent + thinking
      warmer + thinking-lane personas + consolidator. Pass-through to
      --model; empty = inherit the CLI default.

  - token: ""
    type: string
    default: ""
    yaml_path: models.sonnet
    cli_flag: --sonnet-model
    validate: {}
    description: >-
      Model id pinned for the normal lane: mechanical personas
      (conventions/accessibility/diagrams/contracts/tests) and the
      normal-lane warmer. Pass-through to --model; empty = "sonnet"
      alias for Claude.

  - token: ""
    type: string
    default: ""
    yaml_path: effort
    cli_flag: --effort
    validate: { enum: ["", low, medium, high, xhigh, max] }
    description: >-
      Reasoning-effort flag passed to every work-agent subprocess.
      Reviewers and consolidator are unaffected.

  - token: ""
    type: list-of-string
    default: []
    yaml_path: ci.ignore_jobs
    cli_flag: ""
    validate: { entry_max_len: 256 }
    description: >-
      List of CI job names the impl-phase CI wait treats as advisory.

  - token: ""
    type: list-of-string
    default: []
    yaml_path: review.impl_lanes
    cli_flag: ""
    validate:
      enum: [impl-review-intent, impl-review-architecture, impl-review-contracts,
             impl-review-principal, impl-review-conventions, impl-review-security,
             impl-review-taint, impl-review-reliability, impl-review-tests,
             impl-review-maintainability, impl-review-accessibility,
             impl-review-diagrams, all]
    description: >-
      Impl-phase reviewer roster narrowing. Empty = full 12-persona
      fan-out. Literal ["all"] is a no-op sentinel.

  - token: ""
    type: string-map
    default:
      impl-draft: "agent-loop/impl-draft"
      awaiting-human-pr-approval: "agent-loop/awaiting-human-pr"
      awaiting-human-impl-triage: "agent-loop/awaiting-human-triage"
      awaiting-team-review: "agent-loop/awaiting-team-review"
      impasse: "agent-loop/impasse"
    merge_strategy: deep-merge-with-empty-disables-slot
    yaml_path: labels.pr
    cli_flag: ""
    validate: { entry_max_len: 50, key_max_len: 64 }
    description: >-
      PR status-label slot mapping. Plan-phase slots are not included
      since impl-loop has no plan phase.

  - token: ""
    type: string-map
    default:
      in_progress: "agent-loop/in-progress"
      ready: "agent-loop/ready"
      epic: "agent-loop/epic"
      sub_ticket: "agent-loop/sub-ticket"
    merge_strategy: deep-merge-with-empty-disables-slot
    yaml_path: labels.issue
    cli_flag: ""
    validate: { entry_max_len: 50, key_max_len: 64 }
    description: >-
      Issue-label slot mapping (epic, sub_ticket, ready, in_progress).

  - token: ""
    type: string
    default: "dangerously-bypass-approvals-and-sandbox"
    yaml_path: adapters.codex.permission_mode
    cli_flag: --codex-permission-mode
    validate:
      enum: ["", "dangerously-bypass-approvals-and-sandbox", "full-auto",
             "read-only", "workspace-write", "danger-full-access",
             "bypassPermissions"]
    description: >-
      Codex sandbox level. Only consumed when adapters.prompt_runner is
      "codex-resume".

  - token: ""
    type: bool
    default: false
    yaml_path: adapters.dry_run
    cli_flag: --dry-run
    validate: {}
    description: >-
      Adapter-agnostic dry-run flag.
