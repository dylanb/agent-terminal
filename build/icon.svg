<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B141F"/>
      <stop offset="1" stop-color="#081019"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8F8"/>
      <stop offset="1" stop-color="#E2EBEC"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="#FFFFFF"/>
  <rect x="28" y="28" width="968" height="968" rx="176" fill="none" stroke="#CBD5E1" stroke-width="3"/>

  <!-- soft glow behind screen -->
  <ellipse cx="360" cy="500" rx="280" ry="240" fill="url(#glow)"/>

  <!-- desk -->
  <rect x="90" y="780" width="844" height="26" rx="13" fill="#F1F5F9" stroke="#0D9488" stroke-width="3"/>
  <line x1="120" y1="806" x2="120" y2="900" stroke="#94A3B8" stroke-width="6"/>
  <line x1="900" y1="806" x2="900" y2="900" stroke="#94A3B8" stroke-width="6"/>

  <!-- ===== MONITOR ===== -->
  <g>
    <!-- stand -->
    <path d="M330 700 L390 700 L405 778 L315 778 Z" fill="#E2EBEC" stroke="#0D9488" stroke-width="3"/>
    <rect x="290" y="772" width="140" height="14" rx="7" fill="#F1F5F9" stroke="#0D9488" stroke-width="3"/>
    <!-- bezel -->
    <rect x="150" y="360" width="420" height="340" rx="22" fill="#F4F8F8" stroke="#0D9488" stroke-width="5"/>
    <!-- screen -->
    <rect x="178" y="388" width="364" height="284" rx="12" fill="url(#screen)"/>
    <!-- terminal content -->
    <g font-family="monospace" font-size="34" fill="#5EEAD4">
      <text x="200" y="438">&gt;_ run agent</text>
    </g>
    <g stroke-linecap="round">
      <line x1="200" y1="470" x2="248" y2="470" stroke="#46C7B8" stroke-width="9"/>
      <line x1="266" y1="470" x2="430" y2="470" stroke="#2A4A5C" stroke-width="9"/>
      <line x1="200" y1="506" x2="360" y2="506" stroke="#2A4A5C" stroke-width="9"/>
      <line x1="200" y1="542" x2="300" y2="542" stroke="#2A4A5C" stroke-width="9"/>
      <line x1="200" y1="578" x2="410" y2="578" stroke="#2A4A5C" stroke-width="9"/>
      <line x1="200" y1="614" x2="270" y2="614" stroke="#46C7B8" stroke-width="9"/>
    </g>
    <!-- blinking cursor block -->
    <rect x="292" y="600" width="26" height="30" rx="3" fill="#F59E0B"/>
  </g>

  <!-- keyboard -->
  <g>
    <rect x="486" y="744" width="232" height="40" rx="10" fill="#F1F5F9" stroke="#0D9488" stroke-width="3"/>
    <g fill="#CBD5E1">
      <rect x="502" y="754" width="22" height="9" rx="3"/>
      <rect x="532" y="754" width="22" height="9" rx="3"/>
      <rect x="562" y="754" width="22" height="9" rx="3"/>
      <rect x="592" y="754" width="22" height="9" rx="3"/>
      <rect x="622" y="754" width="22" height="9" rx="3"/>
      <rect x="652" y="754" width="22" height="9" rx="3"/>
      <rect x="682" y="754" width="22" height="9" rx="3"/>
      <rect x="518" y="769" width="22" height="9" rx="3"/>
      <rect x="548" y="769" width="118" height="9" rx="3" fill="#14B8A6"/>
      <rect x="674" y="769" width="22" height="9" rx="3"/>
    </g>
  </g>

  <!-- ===== ROBOT ===== -->
  <g>
    <!-- torso -->
    <rect x="690" y="520" width="190" height="180" rx="30" fill="url(#bot)" stroke="#0D9488" stroke-width="5"/>
    <!-- chest core -->
    <circle cx="785" cy="600" r="34" fill="#0F1B2A" stroke="#0D9488" stroke-width="5"/>
    <circle cx="785" cy="600" r="13" fill="#2DD4BF"/>
    <line x1="722" y1="556" x2="752" y2="556" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="722" y1="584" x2="746" y2="584" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

    <!-- arm: upper + forearm to hand on keyboard -->
    <g fill="none" stroke="#0D9488" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M700 566 L646 648"/>
      <path d="M646 648 L606 738"/>
    </g>
    <g fill="none" stroke="#F4F8F8" stroke-width="10" stroke-linecap="round">
      <path d="M700 566 L646 648"/>
      <path d="M646 648 L606 738"/>
    </g>
    <circle cx="646" cy="648" r="14" fill="#F4F8F8" stroke="#0D9488" stroke-width="4"/>
    <!-- hand -->
    <circle cx="606" cy="742" r="22" fill="url(#bot)" stroke="#0D9488" stroke-width="5"/>

    <!-- neck -->
    <rect x="760" y="486" width="44" height="44" rx="10" fill="#F1F5F9" stroke="#0D9488" stroke-width="4"/>

    <!-- head -->
    <rect x="700" y="360" width="180" height="150" rx="34" fill="url(#bot)" stroke="#0D9488" stroke-width="5"/>
    <!-- face plate -->
    <rect x="724" y="392" width="132" height="86" rx="20" fill="#0F1B2A" stroke="#0D9488" stroke-width="4"/>
    <!-- eyes -->
    <circle cx="762" cy="435" r="15" fill="#2DD4BF"/>
    <circle cx="818" cy="435" r="15" fill="#2DD4BF"/>
    <!-- antenna -->
    <line x1="790" y1="360" x2="790" y2="318" stroke="#0D9488" stroke-width="6" stroke-linecap="round"/>
    <circle cx="790" cy="306" r="14" fill="#F59E0B"/>
    <!-- side ear -->
    <rect x="862" y="410" width="20" height="48" rx="8" fill="#F1F5F9" stroke="#0D9488" stroke-width="4"/>
  </g>
</svg>
