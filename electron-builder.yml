appId: dev.agentterminal.app
productName: Agent Terminal
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
  # Keep the sourced shell-integration script on disk so bash can read it (§15.5 / D3).
  - out/main/**
mac:
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
  category: Development
