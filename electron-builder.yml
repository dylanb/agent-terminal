appId: dev.agentterminal.app
productName: agent-terminal
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
  # Keep the sourced shell-integration script on disk so bash can read it (§15.5 / D3).
  # Scoped to the .bash asset only — the compiled main bundle stays sealed inside the asar.
  - out/main/**/*.bash
# BrowserWindow.icon loads from disk at runtime; ship the raster beside the asar so the resolved
# process.resourcesPath/icon.png exists in a packaged app (see resolveWindowIconPath).
extraResources:
  - from: build/icon.png
    to: icon.png
  # The install-examples action (§18.1/§23.4/§27.8) reads the bundled trees at runtime; ship each under
  # the path its packaged resolver reads back (process.resourcesPath/example/<tree>, see exampleAssets).
  # The selectable flow catalog (§18.7.1), read back by resolveExampleFlowsDir; its feature-dev-v3 entry is
  # also the global-fallback `flow` source (resolveFeatureDevFlowDir), so one tree ships both.
  - from: example/flows
    to: example/flows
  # The §27 (v2) def tree — the app-bundled resolution tier read by resolveExampleLoopsV2Dir.
  - from: example/loops-v2
    to: example/loops-v2
  - from: example/commands
    to: example/commands
  # The Codex skills (§18.1 v2.199), read back by resolveExampleCodexSkillsDir.
  - from: example/codex-skills
    to: example/codex-skills
  # The engine guide is generated by the build, never committed, so it ships from the build output; read back
  # by resolveEngineGuideFile.
  - from: out/main/example/engine-capabilities.md
    to: example/engine-capabilities.md
mac:
  # Release signing is chosen on the command line by .github/workflows/release.yml (ad-hoc today; see
  # docs/releasing.md § macOS signing). Do not pin an identity here; development bundle signing belongs
  # to scripts/sign-bundle.sh.
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
  category: Development
  syncDesktopName: true
