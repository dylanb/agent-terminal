appId: dev.agentterminal.app
productName: agent-terminal
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
  # Keep the sourced shell-integration script on disk so bash can read it (§15.5 / D3).
  # Scoped to the .bash asset only — the compiled main bundle stays sealed inside the asar.
  - out/main/**/*.bash
# BrowserWindow.icon loads from disk at runtime; ship the raster beside the asar so the resolved
# process.resourcesPath/icon.png exists in a packaged app (see resolveWindowIconPath).
extraResources:
  - from: build/icon.png
    to: icon.png
  # The install-examples action (§18.1/§23.4) reads the bundled flow at runtime; ship it under the path
  # the packaged resolver reads back (process.resourcesPath/example/flow, see resolveExampleFlowDir).
  - from: example/flow
    to: example/flow
mac:
  # No `identity:` override and no `hardenedRuntime: false`. macOS grants notification authorization only to
  # a bundle whose signature binds its Info.plist (§24.2.3 T4), but pinning an ad-hoc identity here would
  # also pin it for a release build — an ad-hoc signature cannot be notarized, and the hardened runtime it
  # forces off is what Gatekeeper and notarization require. A release signs with a real Developer ID (which
  # binds the Info.plist too); dev-mode notifications come from `scripts/sign-bundle.sh` on the vendored
  # Electron, never from the distributed artifact's configuration.
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
  category: Development
  syncDesktopName: true
